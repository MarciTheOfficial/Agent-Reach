<title>Tenderpilóta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..700&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky masthead (brand, profile switch, tabs) over one workspace; tenders use a filter rail + list,
   and a tender opens in a right-hand drawer that becomes a full sheet on phones. Stamp-ink blue on cool paper. */
:root{
  --paper:#F1F3F7;
  --card:#FFFFFF;
  --sunk:#E9ECF3;
  --ink:#151B2C;
  --ink-2:#465068;
  --ink-3:#5F6880;
  --rule:#D6DBE6;
  --accent:#2E3FA3;
  --accent-ink:#FFFFFF;
  --accent-soft:#E4E8FA;
  --ok:#17693F; --ok-soft:#DDF1E5;
  --warn:#8F5300; --warn-soft:#FAEDD6;
  --bad:#B42318; --bad-soft:#FBE5E2;
  --bar-muted:#8790A3;
  --scrim:rgba(13,18,30,.42);
  --shadow:0 1px 2px rgba(21,27,44,.06),0 12px 32px rgba(21,27,44,.14);
  --f-display:"Bricolage Grotesque","Public Sans",system-ui,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E121B; --card:#161B27; --sunk:#1E2434; --ink:#E8EBF3; --ink-2:#B0B7C9; --ink-3:#949CB2; --rule:#2B3246;
    --accent:#A6B2FF; --accent-ink:#10142A; --accent-soft:#252C52;
    --ok:#66CF96; --ok-soft:#16301F; --warn:#EDB25A; --warn-soft:#382A12; --bad:#F48E84; --bad-soft:#3D1D1A;
    --bar-muted:#68718A; --scrim:rgba(0,0,0,.55); --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E121B; --card:#161B27; --sunk:#1E2434; --ink:#E8EBF3; --ink-2:#B0B7C9; --ink-3:#949CB2; --rule:#2B3246;
  --accent:#A6B2FF; --accent-ink:#10142A; --accent-soft:#252C52;
  --ok:#66CF96; --ok-soft:#16301F; --warn:#EDB25A; --warn-soft:#382A12; --bad:#F48E84; --bad-soft:#3D1D1A;
  --bar-muted:#68718A; --scrim:rgba(0,0,0,.55); --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html.locked,html.locked body{overflow:hidden}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:30}
h1,h2,h3,h4{margin:0;font-family:var(--f-display);font-weight:700;letter-spacing:-.01em;line-height:1.2;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-size:.92em}
.muted{color:var(--ink-3)}
.small{font-size:12.5px}
.nowrap{white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{width:100%;max-width:1240px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* masthead */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--rule)}
.top-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding-block:12px 6px}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
.brand-mark{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--accent);border:2px solid var(--accent);box-shadow:inset 0 0 0 3px var(--card),inset 0 0 0 4.5px var(--accent);font-family:var(--f-display);font-weight:700;font-size:16px;transform:rotate(-9deg)}
.brand-text{display:grid;line-height:1.15}
.brand-name{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.015em}
.brand-sub{font-size:12px;color:var(--ink-3)}
.top-chips{display:flex;flex-wrap:wrap;gap:6px}
.pick{display:flex;align-items:center;gap:8px;min-width:0}
.pick label{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.pick select{width:auto;max-width:min(320px,70vw)}
@media (max-width:640px){.pick{width:100%}.pick select{flex:1;max-width:none}}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-bottom:-1px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;appearance:none;background:none;border:0;border-bottom:2px solid transparent;padding:10px 12px 9px;font-weight:600;color:var(--ink-2);cursor:pointer;border-radius:6px 6px 0 0}
.tab:hover{color:var(--ink);background:var(--sunk)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.notice{font-size:12.5px;color:var(--ink-2);padding-block:14px 0}
.notice b{color:var(--warn)}

/* chips, controls */
.chip{display:inline-flex;align-items:center;gap:5px;min-height:22px;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.chip.sample{background:var(--warn-soft);color:var(--warn)}
.chip.ai-on{background:var(--ok-soft);color:var(--ok)}
.chip.new{background:var(--accent-soft);color:var(--accent)}
.chip.me{background:var(--accent);color:var(--accent-ink)}
.chip.tiny{min-height:18px;font-size:11px;padding:0 6px}
input[type=text],input[type=search],input[type=number],select,textarea{width:100%;min-height:38px;padding:7px 10px;background:var(--card);border:1px solid var(--rule);border-radius:8px;color:var(--ink)}
select{min-width:0;max-width:100%}
textarea{resize:vertical;line-height:1.45}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;margin:0;flex:none}
.field{display:grid;gap:5px;min-width:0}
.field>label,.lbl{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.check{display:flex;gap:8px;align-items:center;font-weight:500;cursor:pointer}
.fs{border:0;padding:0;margin:0;display:grid;gap:8px}
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:7px 14px;border-radius:8px;border:1px solid var(--rule);background:var(--card);color:var(--ink);font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--sunk)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--card)}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
.btn-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.link{appearance:none;background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px;text-align:left}
.icon-btn{appearance:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--rule);background:var(--card);color:var(--ink-2);display:grid;place-items:center;cursor:pointer;font-size:15px;flex:none}
.icon-btn:hover{color:var(--ink);border-color:var(--ink-3)}

/* tenders */
.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:24px;align-items:start;padding-block:18px 56px}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 112px)}
.filters{background:var(--card);border:1px solid var(--rule);border-radius:12px}
.filters>summary{list-style:none;cursor:pointer;padding:12px 14px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.filters>summary::-webkit-details-marker{display:none}
.filters>summary::after{content:"+";font-size:18px;line-height:1;color:var(--ink-3)}
.filters[open]>summary::after{content:"−"}
.fbody{display:grid;gap:14px;padding:0 14px 14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr);gap:14px}.rail{position:static}}
.res-head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:end;justify-content:space-between;margin-bottom:12px}
.h1{font-size:26px}
.sub{color:var(--ink-2);margin-top:4px;max-width:70ch}
.inline{display:flex;align-items:center;gap:8px}
.inline select{width:auto}
.tlist{display:grid;gap:10px}
.trow{appearance:none;width:100%;text-align:left;display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:6px 16px;align-items:start;padding:14px 16px;background:var(--card);border:1px solid var(--rule);border-radius:12px;cursor:pointer;color:inherit}
.trow:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--rule))}
.fit{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:16px;border:2px solid currentColor;font-variant-numeric:tabular-nums;flex:none}
.fit.hi{color:var(--ok);background:var(--ok-soft)}
.fit.mid{color:var(--warn);background:var(--warn-soft)}
.fit.lo{color:var(--ink-3);background:var(--sunk)}
.tmain{display:grid;gap:4px;min-width:0}
.ttitle{font-weight:700;font-size:15.5px;line-height:1.3;color:var(--ink)}
.tmeta{color:var(--ink-2);font-size:13px}
.tchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tside{display:grid;justify-items:end;text-align:right;min-width:120px}
.tval{font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.tlbl{font-size:11.5px;color:var(--ink-3)}
.due{font-weight:700}
.tside .due{margin-top:6px}
.due.urgent{color:var(--bad)}
.due.soon{color:var(--warn)}
@media (max-width:640px){
  .trow{grid-template-columns:44px minmax(0,1fr);padding:12px 14px}
  .fit{width:40px;height:40px;font-size:14px}
  .tside{grid-column:2;justify-items:start;text-align:left;display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline;min-width:0}
  .tside .due{margin-top:0}
}
.empty{padding:28px;border:1px solid var(--rule);border-radius:12px;text-align:center;color:var(--ink-2);background:var(--card)}

/* drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(800px,100%);background:var(--paper);z-index:41;overflow-y:auto;overscroll-behavior:contain;box-shadow:var(--shadow);animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.drawer{animation:none}}
.d-head{position:sticky;top:0;z-index:3;background:var(--card);border-bottom:1px solid var(--rule);display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:start;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:14px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.d-title{font-size:21px;margin-top:4px}
.d-buyer{margin-top:6px;color:var(--ink-2)}
.stamp{--c:var(--ink-3);width:82px;height:82px;border-radius:50%;display:grid;place-content:center;text-align:center;color:var(--c);border:2.5px solid var(--c);box-shadow:inset 0 0 0 4px var(--card),inset 0 0 0 5.5px var(--c);transform:rotate(-8deg);flex:none}
.stamp.hi{--c:var(--ok)}
.stamp.mid{--c:var(--warn)}
.stamp b{font-family:var(--f-display);font-size:28px;line-height:1}
.stamp span{font-size:9px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;margin-top:3px}
@media (max-width:560px){
  .d-head{grid-template-columns:minmax(0,1fr) auto}
  .d-title-wrap{grid-row:1/3}
  .d-head .icon-btn{grid-row:1;grid-column:2}
  .stamp{grid-row:2;grid-column:2;width:62px;height:62px;justify-self:end}
  .stamp b{font-size:21px}
  .stamp span{font-size:7.5px;letter-spacing:.12em}
}
.pad{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.d-actions{display:flex;flex-wrap:wrap;gap:8px;padding-block:14px 4px}
.ai-off{font-size:13px;color:var(--ink-2);background:var(--sunk);border-radius:10px;padding:10px 12px;margin-top:8px}
.dsec{padding-block:18px;border-bottom:1px solid var(--rule);display:grid;gap:10px}
.dsec:last-child{border-bottom:0;padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
.dsec>h3{font-size:16px}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:10px;overflow:hidden;margin:0}
@media (min-width:820px){.facts{grid-template-columns:repeat(4,minmax(0,1fr))}}
.fact{background:var(--card);padding:10px 12px;min-width:0}
.fact dt{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.fact dd{margin:3px 0 0;font-weight:600}
.bd{display:grid;gap:12px}
.bd-row{display:grid;grid-template-columns:190px 120px 52px minmax(0,1fr);gap:4px 12px;align-items:center}
.bd-l{font-weight:600}
.bd-m{height:8px;border-radius:999px;background:var(--accent-soft);overflow:hidden}
.bd-m span{display:block;height:100%;border-radius:999px;background:var(--accent)}
.bd-s{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.bd-w{color:var(--ink-2);font-size:13px}
@media (max-width:760px){.bd-row{grid-template-columns:minmax(0,1fr) 90px 44px}.bd-w{grid-column:1/-1}}
.verdict{font-weight:700;padding:10px 12px;border-radius:10px}
.v-go{background:var(--ok-soft);color:var(--ok)}
.v-cond{background:var(--warn-soft);color:var(--warn)}
.v-cons,.v-no{background:var(--bad-soft);color:var(--bad)}
.reqs{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.req{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;padding:10px 12px;background:var(--card);border:1px solid var(--rule);border-radius:10px}
.req-code{font-weight:500;color:var(--accent);padding-top:1px}
.req-body{display:grid;gap:6px;min-width:0}
.req-auto,.req-ai{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:baseline;font-size:13px}
.st{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.st.ok{background:var(--ok-soft);color:var(--ok)}
.st.part{background:var(--warn-soft);color:var(--warn)}
.st.fail{background:var(--bad-soft);color:var(--bad)}
.st.check{background:var(--sunk);color:var(--ink-2)}
.ai-tag{font-size:10.5px;font-weight:800;letter-spacing:.08em;color:var(--accent);border:1.5px solid var(--accent);border-radius:4px;padding:0 4px}
.crit{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.crit li{display:grid;grid-template-columns:minmax(0,1fr) 140px 64px;gap:12px;align-items:center}
.wbar{height:8px;border-radius:999px;background:var(--accent-soft);overflow:hidden}
.wbar span{display:block;height:100%;background:var(--accent);border-radius:999px}
.crit .w{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
@media (max-width:560px){.crit li{grid-template-columns:minmax(0,1fr) 64px}.crit .wbar{display:none}}
.hist{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.hist li{display:grid;gap:2px;padding-left:12px;border-left:2px solid var(--rule)}
.single{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--bad);border:1.5px solid var(--bad);border-radius:4px;padding:0 5px;transform:rotate(-2deg);margin-left:4px;white-space:nowrap}

/* AI output */
.ai-out{display:grid;gap:8px;font-size:14px}
.ai-out ul,.doc ul{margin:0;padding-left:20px;display:grid;gap:4px}
.thinking{display:flex;align-items:center;gap:10px;color:var(--ink-2)}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--accent-soft);border-top-color:var(--accent);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
.err{color:var(--bad);font-weight:600;font-size:13px}
.ai-box{display:grid;gap:10px}
.ai-verdict{display:grid;gap:6px;padding:12px 14px;border-radius:10px}
.ai-verdict b{font-size:16px}
.ai-verdict ul{margin:0;padding-left:18px}
.doc{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:20px 22px;display:grid;gap:8px;line-height:1.6;min-width:0}
.doc h3{font-size:19px}
.doc h4{font-size:15.5px;margin-top:10px}
.doc h5{font-size:14px;margin:6px 0 0;font-family:var(--f-body)}
.doc em{color:var(--ink-3)}
mark.todo{background:var(--warn-soft);color:var(--warn);border-radius:4px;padding:0 3px;font-weight:600}
.copy-fallback{min-height:160px;font-family:var(--f-mono);font-size:12.5px}

/* pages */
.page-head{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between;padding-block:18px 14px}
.stack{display:grid;gap:16px;padding-bottom:56px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:820px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:12px 14px;display:grid;gap:2px;min-width:0}
.stat .lbl{font-size:12.5px;color:var(--ink-2);font-weight:600}
.stat .val{font-size:26px;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.stat .sub{font-size:12px;color:var(--ink-3);margin:0}
.card{background:var(--card);border:1px solid var(--rule);border-radius:12px;padding:16px 18px;display:grid;gap:12px;min-width:0;align-content:start}
.card-h{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:baseline}
.card-h h2{font-size:17px}
.mk-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);grid-template-areas:"chart watch" "recent watch";gap:16px;align-items:start}
.mk-chart{grid-area:chart}.mk-watch{grid-area:watch}.mk-recent{grid-area:recent}
@media (max-width:980px){.mk-grid{grid-template-columns:minmax(0,1fr);grid-template-areas:"chart" "watch" "recent"}}
.bars{display:grid;gap:2px}
.bar-row{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:12px;align-items:center;min-height:36px;border-radius:6px;padding:0 4px;cursor:default}
.bar-row:hover,.bar-row:focus-visible{background:var(--sunk)}
.bar-label{font-size:13px;line-height:1.25;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;min-width:0}
.bar-track{display:flex;align-items:center;gap:8px;height:28px;border-left:1px solid var(--rule);min-width:0}
.bar{height:14px;border-radius:0 4px 4px 0;background:var(--bar-muted);flex:none}
.bar.me{background:var(--accent)}
.bar-val{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:560px){.bar-row{grid-template-columns:minmax(0,1fr);gap:2px;padding-block:4px}}
.tbl-wrap{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-weight:700;background:var(--sunk)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.comp{display:grid;gap:8px;padding-top:14px;border-top:1px solid var(--rule)}
.comp-h{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.comp-h h3{font-size:16px}

}

/* ---------- scoring ---------- */
const TIER = { hi: 'erős illeszkedés', mid: 'részleges illeszkedés', lo: 'gyenge illeszkedés' };
const ST_LABEL = { ok: '✓ Megfelel', part: '◐ Részben', fail: '✕ Nem felel meg', check: '? Ellenőrizendő' };
const stChip = st => `<span class="st ${st}">${ST_LABEL[st] || ST_LABEL.check}</span>`;
const digits = c => String(c).replace(/[^0-9]/g, '');

function cpvScore(p, t) {
  if (!p.cpv.length) return { score: 0, max: 40, why: 'A profilban még nincs CPV-kód' };
  let best = 0, why = 'Nincs egyezés a profil tevékenységeivel';
  const levels = [[8, 40, 'Pontos CPV-egyezés'], [5, 32, 'Azonos CPV-kategória'], [4, 26, 'Azonos CPV-osztály'], [3, 18, 'Azonos CPV-csoport'], [2, 8, 'Csak az ágazat egyezik']];
  for (const c of [t.cpv, ...t.cpvExtra]) {
    for (const pc of p.cpv) {
      for (const [n, s, label] of levels) {
        if (digits(c).slice(0, n) === digits(pc).slice(0, n)) {
          if (s > best) { best = s; why = `${label} (${c} ${cpvName(c)})`; }
          break;
        }
      }
    }
  }
  return { score: best, max: 40, why };
}
function regionScore(p, t) {
  if (p.regions.includes(t.nuts)) return { score: 20, max: 20, why: `A célterületen belül: ${REG[t.nuts]}` };
  if (p.regions.includes('ORSZ')) return { score: 14, max: 20, why: `Országos működés, a helyszín vállalható: ${REG[t.nuts]}` };
  if (p.regions.some(r => r.slice(0, 4) === t.nuts.slice(0, 4))) return { score: 12, max: 20, why: `Szomszédos megye ugyanabban a régióban: ${REG[t.nuts]}` };
  return { score: 0, max: 20, why: p.regions.length ? `Távoli helyszín: ${REG[t.nuts]}` : 'A profilban még nincs célterület' };
}
function sizeScore(p, t) {
  if (!p.revenue) return { score: 0, max: 15, why: 'Az árbevétel nincs megadva' };
  const r = t.value / p.revenue;
  if (r <= 1) return { score: 15, max: 15, why: `A becsült érték az éves árbevétel ${fmtPct(r)}-a` };
  if (r <= 2) return { score: 8, max: 15, why: `A becsült érték az éves árbevétel ${fmtPct(r)}-a, ez kapacitáskockázat` };
  return { score: 0, max: 15, why: `A becsült érték az árbevétel ${nf1.format(r)}-szorosa, önállóan nehezen vállalható` };
}
const normCert = s => String(s).toLowerCase().replace(/iso\s*\/\s*iec/g, 'iso').replace(/[^a-z0-9]/g, '');
function checkReq(p, q) {
  if (q.type === 'ref') {
    const yearMin = CUR_YEAR - (q.years || 5);
    const cands = p.references.filter(r => q.cpv.some(px => digits(r.cpv).startsWith(px)));
    const recent = cands.filter(r => r.year >= yearMin);
    const good = recent.filter(r => r.value >= (q.min || 0)).sort((a, b) => b.value - a.value);
    if (good.length) {
      if (q.kw && !good.some(r => r.title.toLowerCase().includes(q.kw))) return { st: 'part', why: `Van ágazati referencia (${good[0].title}), de nem ${q.kw}i jellegű` };
      const g = q.kw ? good.find(r => r.title.toLowerCase().includes(q.kw)) : good[0];
      return { st: 'ok', why: `${g.title} (${fmtM(g.value)}, ${g.year})` };
    }
    if (recent.length) { const m = Math.max(...recent.map(r => r.value)); return { st: 'part', why: `Van hasonló referencia, de a legnagyobb (${fmtM(m)}) a minimum (${fmtM(q.min)}) alatt marad` }; }
    if (cands.length) return { st: 'part', why: `Van hasonló referencia, de ${yearMin} előtti` };
    return { st: 'fail', why: 'Nincs a feltételnek megfelelő referencia a profilban' };
  }
  if (q.type === 'staff') {
    if (!p.staff.length) return { st: 'check', why: 'A profilban nincs szakemberadat' };
    const s = p.staff.find(x => x.role.toLowerCase().includes(q.role.toLowerCase()));
    if (!s) return { st: 'fail', why: `Nincs „${q.role}” szakember a profilban` };
    if (s.count >= (q.count || 1) && s.years >= (q.years || 0)) return { st: 'ok', why: `${s.count} fő ${s.role}, ${s.years} év tapasztalat` };
    return { st: 'part', why: `${s.role}: ${s.count} fő, ${s.years} év (elvárás: ${q.count || 1} fő${q.years ? ', ' + q.years + ' év' : ''})` };

  const meHere = winsAt(p.name, t.buyer);
  if (meHere) reasons.push(`Már nyert ennél az ajánlatkérőnél (${meHere}×)`);
  if (inc && fold(inc) !== fold(p.name)) reasons.push(`Az előző hasonló szerződést ${inc} nyerte`);

  L.push('## 4. Javasolt vállalások az értékelési szempontokra');
  t.criteria.forEach(([n, w]) => L.push(`- **${n}** (${w} pont): ${/ár/i.test(n) ? `[KITÖLTENDŐ: ajánlati ár; a becsült érték nettó ${fmtM(t.value)}]` : '[KITÖLTENDŐ: vállalás]'}`));
  L.push('## 5. Benyújtandó dokumentumok – ellenőrzőlista');
  docList(t).forEach(d => L.push(`- ${d}`));
  L.push('## 6. Nyitott kérdések, kockázatok');
  const risks = ev.reqs.filter(q => q.st !== 'ok').map(q => `- ${q.code}: ${q.why}`);
  if (t.dueIn <= 7) risks.push(`- Szoros határidő: az ajánlatot ${dueText(t.dueIn)} be kell adni.`);
  if (p.revenue && t.value > p.revenue) risks.push('- A becsült érték meghaladja az éves árbevételt: kapacitás- és finanszírozási kockázat.');
  L.push(...(risks.length ? risks : ['- Az automatikus ellenőrzés nem talált nyitott kérdést. [KITÖLTENDŐ: helyszíni bejárás, kiegészítő tájékoztatás]']));
  return L.join('\n');
}
function mdToHtml(md) {
  const inline = s => s
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\[KITÖLTENDŐ[^\]]*\]/g, m => `<mark class="todo">${m}</mark>`)
    .replace(/(^|\s)_(.+?)_(?=\s|$)/g, '$1<em>$2</em>');
  let html = '', inList = false;
  for (const raw of esc(md).split('\n')) {
    const line = raw.trimEnd();
    if (/^\s*[-*•]\s+/.test(line)) {
      if (!inList) { html += '<ul>'; inList = true; }
      html += `<li>${inline(line.replace(/^\s*[-*•]\s+/, ''))}</li>`;
      continue;
    }
    if (inList) { html += '</ul>'; inList = false; }
    if (/^###\s+/.test(line)) html += `<h5>${inline(line.replace(/^###\s+/, ''))}</h5>`;
    else if (/^##\s+/.test(line)) html += `<h4>${inline(line.replace(/^##\s+/, ''))}</h4>`;
    else if (/^#\s+/.test(line)) html += `<h3>${inline(line.replace(/^#\s+/, ''))}</h3>`;
    else if (line.trim()) html += `<p>${inline(line)}</p>`;
  }
  if (inList) html += '</ul>';
  return html;
}

async function runSummary(t) {
  if (mem.sum[t.id] && mem.sum[t.id].status === 'running') return;

  paintSummary(t);

    m.status = 'done'; m.text = r.text; m.truncated = r.truncated;

}
async function runQual(t) {

  if (mem.qual[k] && mem.qual[k].status === 'running') return;

async function runDraft(t, again) {
  const p = prof(), k = qkey(p, t);

  if (!sample) { setAiOff(); return; }

  const m = mem.draft[k] = { status: 'running', text: '', source: 'ai', ctl: new AbortController() };

}

function filteredTenders(all) {
  const p = prof(), f = state.f;

  if (f.q) { const q = f.q.toLowerCase(); list = list.filter(({ t }) => [t.title, t.buyer, t.summary, t.ekr, cpvName(t.cpv)].join(' ').toLowerCase().includes(q)); }

  if (f.div) list = list.filter(({ t }) => [t.cpv, ...t.cpvExtra].some(c => digits(c).startsWith(f.div)));
  if (f.region === 'profile') list = list.filter(({ t }) => p.regions.includes(t.nuts) || p.regions.includes('ORSZ'));
  else if (f.region) list = list.filter(({ t }) => t.nuts === f.region);
  if (f.regime) list = list.filter(({ t }) => t.regime === f.regime);
  if (f.due) list = list.filter(({ t }) => t.dueIn <= Number(f.due));

function paintAiAvail() {
  if (!state.open) return;
  const off = ai.state === 'off';
  $$('[data-ai-btn]', $('#drawer')).forEach(b => {
    b.disabled = off;
    b.title = off ? 'Az AI-funkciók a claude.ai-on megnyitva működnek.' : '';

}
function paintSummary(t) {
  if (state.open !== t.id) return;
  const m = mem.sum[t.id], sec = $('#sec-summary'), out = $('#out-summary');
  if (!sec) return;
  if (!m || (m.status === 'stopped' && !m.text)) { sec.hidden = true; return; }
  sec.hidden = false;
  if (m.status === 'running' && !m.text) { out.innerHTML = thinking('Az AI olvassa a kiírást…') + '<div><button class="btn ghost" type="button" data-act="stop-sum">Leállítás</button></div>'; return; }
  out.innerHTML = mdToHtml(m.text || '') + (m.err ? `<p class="err">${esc(m.err)}</p>` : '') + (m.truncated ? '<p class="small muted">A válasz a hosszkorlát miatt megszakadt.</p>' : '');
}
const AI_ST = { 'megfelel': 'ok', 'részben': 'part', 'nem felel meg': 'fail', 'nem derül ki': 'check' };
const AI_VERDICT = { 'indulj': ['go', 'Indulj'], 'konzorciummal': ['cons', 'Konzorciummal vagy alvállalkozóval'], 'ne indulj': ['no', 'Ne indulj'] };
function paintQual(t) {
  if (state.open !== t.id) return;
  const box = $('#out-qual'); if (!box) return;
  const m = mem.qual[qkey(prof(), t)];
  $$('[data-ai-req]').forEach(el => { el.hidden = true; el.innerHTML = ''; });
  if (!m || m.status === 'stopped') { box.hidden = true; return; }
  box.hidden = false;
  if (m.status === 'running') { box.innerHTML = thinking('Az AI összeveti a profilt a követelményekkel. Ez 10–60 másodperc is lehet.') + '<div><button class="btn ghost" type="button" data-act="stop-qual">Leállítás</button></div>'; return; }
  if (m.status !== 'done' || !m.data) { box.innerHTML = `<p class="err">${esc(m.err || 'Az AI-értékelés nem sikerült.')}</p>`; return; }
  const d = m.data;
  const v = AI_VERDICT[String(d.javaslat || '').trim().toLowerCase()] || ['cond', String(d.javaslat || 'Nincs javaslat')];
  const todo = Array.isArray(d.teendok) ? d.teendok.slice(0, 5) : [];
  box.innerHTML = `<div class="ai-verdict v-${v[0]}"><span class="eyebrow">AI-javaslat</span><b>${esc(v[1])}</b>${d.osszegzes ? `<p>${esc(d.osszegzes)}</p>` : ''}${d.nyeresi_esely ? `<p class="small"><b>Nyerési esély:</b> ${esc(d.nyeresi_esely)}</p>` : ''}${todo.length ? `<p class="small"><b>Teendők:</b></p><ul class="small">${todo.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : ''}</div>`;
  (Array.isArray(d.kovetelmenyek) ? d.kovetelmenyek : []).forEach(r => {
    if (!r || typeof r !== 'object') return;
    const el = document.querySelector(`[data-ai-req="${CSS.escape(String(r.kod || ''))}"]`); if (!el) return;
    el.hidden = false;
    el.innerHTML = `<span class="ai-tag">AI</span> ${stChip(AI_ST[String(r.statusz || '').trim().toLowerCase()] || 'check')} <span>${esc(r.indoklas || '')}</span>`;
  });
}
function paintDraft(t) {
  if (state.open !== t.id) return;
  const out = $('#out-draft'); if (!out) return;
  const m = mem.draft[qkey(prof(), t)];
  const running = !!m && m.status === 'running';
  $('#stop-draft').hidden = !running;
  $$('[data-act="ai-draft"],[data-act="tpl-draft"],[data-act="ai-draft-again"]', $('#drawer')).forEach(b => { b.disabled = running || (b.hasAttribute('data-ai-btn') && ai.state === 'off'); });
  const status = $('#draft-status');
  if (!m) { out.hidden = true; $('#draft-tools').hidden = true; status.textContent = ''; return; }
  out.hidden = false;
  out.innerHTML = running && !m.text ? thinking('Az AI írja a tervezetet. Ez fél–egy perc is lehet.') : mdToHtml(m.text || '');
  status.innerHTML = m.err ? `<span class="err">${esc(m.err)}</span>`
    : running ? 'Írás folyamatban…'
      : m.status === 'stopped' ? 'Leállítva.'
        : m.source === 'tpl' ? 'Sablonból készült, AI nélkül. A kiemelt részeket ki kell tölteni.'
          : 'AI-tervezet. Munkaanyag, beadás előtt szakember nézze át.' + (m.truncated ? ' A szöveg a hosszkorlát miatt megszakadt.' : '');
  $('#draft-tools').hidden = !(m.text && !running);
  $('#dl-draft').hidden = ai.dl === 'off';
}

function mailHtml() {
  const p = prof(), th = report.threshold, weekly = report.freq === 'weekly', win = weekly ? 7 : 3;

  const fresh = evs.filter(x => x.t.pubAgo <= win && x.ev.total >= th).sort((a, b) => b.ev.total - a.ev.total);
  const due = evs.filter(x => x.t.dueIn <= 7 && x.ev.total >= th).sort((a, b) => a.t.dueIn - b.t.dueIn);
  const wl = getWatch(p);

  const subj = weekly ? `Heti tenderösszefoglaló: ${fresh.length} új releváns kiírás` : `${fresh.length} új releváns kiírás · ${fmtShort(TODAY)}`;

      ${report.sDue ? `<section><h3>Lejáró határidők (${due.length})</h3>${due.length ? due.map(item).join('') : '<p class="small muted">A következő 7 napban nem jár le illeszkedő kiírás.</p>'}</section>` : ''}
      ${report.sComp ? `<section><h3>Versenytársak friss eredményei (${comp.length})</h3>${comp.length ? comp.map(a => `<p><b>${esc(a.winner)}</b> nyert: ${esc(a.title)} · ${esc(a.buyer)} · ${fmtM(a.value)}${a.bids === 1 ? ' <span class="single">Egyajánlatos</span>' : ''}<br><span class="small muted">${fmtDate(a.date)}</span></p>`).join('') : '<p class="small muted">Az elmúlt 60 napban nem nyert a figyelt cégek közül senki.</p>'}</section>` : ''}
      <p class="small muted">A beállításokat a Tenderpilóta Napi riport fülén módosíthatod.</p>
    </div>
  </article>`;
}

function freshFinder() { return { q: '', status: 'idle', msg: '', company: null, list: [], savedId: null, manual: null }; }
const blankManual = (name, tax) => ({ name, tax, nuts: '', sector: '', revenue: '', employees: '', desc: '', aiCpv: null, ai: null });
function validateTax(d) {
  if (d.length !== 8 && d.length !== 11) return { ok: false, msg: 'Az adószám 11 számjegyből áll (pl. 12345678-2-41), vagy add meg csak a 8 jegyű törzsszámot.' };
  const w = [9, 7, 3, 1, 9, 7, 3];
  const sum = w.reduce((a, x, i) => a + x * Number(d[i]), 0);
  if ((10 - (sum % 10)) % 10 !== Number(d[7])) return { ok: false, msg: 'Ez nem érvényes adószám: a törzsszám ellenőrző számjegye (a 8. jegy) nem stimmel.' };
  if (d.length === 11) {
    if (!'12345'.includes(d[8])) return { ok: false, msg: 'Érvénytelen ÁFA-kód: a 9. számjegy csak 1–5 lehet.' };
    const area = Number(d.slice(9));
    if (!((area >= 2 && area <= 20) || (area >= 22 && area <= 44) || area === 51)) return { ok: false, msg: 'Érvénytelen területi kód (az utolsó két számjegy).' };
  }
  return { ok: true, tz: d.slice(0, 8), pretty: d.length === 11 ? `${d.slice(0, 8)}-${d[8]}-${d.slice(9)}` : d.slice(0, 8) };
}
function finderSearch(raw) {
  const F = state.finder, q = String(raw || '').trim();
  Object.assign(F, { q, list: [], company: null, savedId: null, msg: '', manual: null });
  if (!q) { F.status = 'idle'; return; }
  const compact = q.replace(/^hu/i, '').replace(/[\s.\-]/g, '');
  if (/^\d+$/.test(compact)) {
    const v = validateTax(compact);
    if (!v.ok) { F.status = 'invalid'; F.msg = v.msg; return; }
    const c = REGISTRY.find(x => digits(x.tax).slice(0, 8) === v.tz);
    if (c) { activateCompany(c); return; }
    F.status = 'notfound'; F.msg = `Érvényes adószám (${v.pretty}), de nincs a példa-cégadatbázisban.`; F.manual = blankManual('', v.pretty);
    return;
  }
  if (fold(q).length < 2) { F.status = 'invalid'; F.msg = 'Adj meg legalább 2 betűt a cégnévből.'; return; }
  const hits = REGISTRY.filter(x => fold(x.name).includes(fold(q)));
  if (hits.length === 1) { activateCompany(hits[0]); return; }
  if (hits.length > 1) { F.status = 'many'; F.list = hits; return; }
  F.status = 'notfound'; F.msg = `„${q}” nincs a példa-cégadatbázisban.`; F.manual = blankManual(q, '');
}

async function aiClassify() {
  const m = state.finder.manual; if (!m) return;
  if (!m.desc.trim() && !m.name.trim()) { toast('Írd le egy mondatban, mivel foglalkozik a cég.'); return; }

  if (!sample) { setAiOff(); renderTab(); return; }
  m.ai = { status: 'running' }; renderTab();

    const d = await sample.json(promptClassify(m), { modelTier: 'quick' });
    const sec = d && typeof d === 'object' && SECTORS[d.szektor] ? d.szektor : null;
    if (!sec) throw { code: 'invalid_json' };
    const cpv = Array.isArray(d.cpv) ? [...new Set(d.cpv.map(String).filter(c => CPV[c]))].slice(0, 6) : [];
    m.sector = sec; m.aiCpv = cpv.length ? cpv : null; m.ai = { status: 'done', why: String(d.indoklas || '') };

    m.ai = { status: 'error', err: aiErr(e && e.code) };
    if (e && PERMANENT.has(e.code)) setAiOff();
  }
  if (state.tab === 'finder' && state.finder.manual === m) renderTab();

  return `<section class="card" aria-labelledby="first-h">
      <div class="card-h"><h2 id="first-h">Itt lenne az első (${first.length})</h2><span class="small muted">${TENDERS.length} nyitott kiírásból ${rows.length} illik hozzá</span></div>
      ${first.length ? first.map(winRow).join('') : '<p class="muted">Most nincs olyan nyitott kiírás, ahol a várható ajánlattevők közül az első helyen állna.</p>'}
    </section>
    <section class="card" aria-labelledby="rest-h">
      <div class="card-h"><h2 id="rest-h">Illeszkedik, de erősebb a verseny (${rest.length})</h2></div>
      ${rest.length ? rest.map(winRow).join('') : '<p class="muted">Nincs ilyen kiírás.</p>'}
    </section>`;
}
function viewFinder() {
  const F = state.finder, p = prof();
  let body = '';
  if (F.status === 'invalid') body = `<p class="form-err" role="alert">${esc(F.msg)}</p>${stepsHtml()}`;
  else if (F.status === 'many') body = `<section class="card"><div class="card-h"><h2>Több találat (${F.list.length})</h2><span class="small muted">válaszd ki a céget</span></div><div class="btn-row">${F.list.map(c => `<button class="btn" type="button" data-act="finder-pick" data-tax="${esc(c.tax)}">${esc(c.name)}</button>`).join('')}</div></section>`;
  else if (F.status === 'notfound' && F.manual) body = manualForm(F);
  else if (F.status === 'found' && F.company) body = (state.pid === TEMP ? tempBar() : '') + companyCard(F.company) + resultsHtml(p);
  else if (F.status === 'created' && state.pid === TEMP && temp) body = tempBar() + createdCard(p) + resultsHtml(p);
  else body = stepsHtml();
  return `${NOTICE}
  <div class="page-head"><div><h1 class="h1">Cégkereső</h1><p class="sub">Írd be egy cég adószámát vagy nevét. Megkeressük a cégadatokat, besoroljuk a tevékenységét, és megmutatjuk, mely közbeszerzések illenek hozzá, és hol lenne esélyes nyerni.</p></div></div>
  <div class="stack">
    <form class="finder-hero" id="finder-form" role="search" novalidate>
      <label class="lbl" for="finder-q">Adószám vagy cégnév</label>
      <div class="finder-form"><input type="search" id="finder-q" value="${esc(F.q)}" placeholder="Pl. 99990024-2-08 vagy Hajdú Gasztro" autocomplete="off" spellcheck="false"><button class="btn primary" type="submit">Keresés</button></div>
      <div class="examples"><span>Próbáld ki:</span>${EXAMPLES.map(x => `<button class="ex" type="button" data-act="finder-example" data-q="${esc(x)}">${esc(x)}</button>`).join('')}</div>
    </form>
    ${body}
  </div>`;
}
function afterFinder() {
  const F = state.finder;
  if (F.status === 'notfound' && F.manual) { $('#mf-nuts').value = F.manual.nuts; $('#mf-sector').value = F.manual.sector; }
}

/* ---------- toast, tooltip, copy ---------- */
let toastTimer;
function toast(msg) {
  const el = $('#toast'); el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 2600);
}
function showTip(row, x, y) {
  const tip = $('#tip');
  const v = document.createElement('strong'); v.textContent = row.dataset.val || '';
  const n = document.createElement('span'); n.textContent = row.dataset.name || '';
  const d = document.createElement('span'); d.className = 'tip-sub'; d.textContent = row.dataset.detail || '';
  tip.replaceChildren(v, n, d); tip.hidden = false;
  placeTip(x, y);
}
function placeTip(x, y) {
  const tip = $('#tip'); if (tip.hidden) return;
  const r = tip.getBoundingClientRect();
  tip.style.left = Math.max(8, Math.min(window.innerWidth - r.width - 8, x + 14)) + 'px';
  tip.style.top = Math.max(8, Math.min(window.innerHeight - r.height - 8, y + 14)) + 'px';
}
const hideTip = () => { $('#tip').hidden = true; };
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast('Vágólapra másolva'); }
  catch {
    const ta = $('#copy-fallback'); if (!ta) return;
    ta.hidden = false; ta.value = text; ta.focus(); ta.select();
    toast('Jelöld ki és másold a szöveget (Ctrl+C / Cmd+C)');
  }
}
async function downloadDraft(t, text) {
  if (!downloads) { toast('A letöltés itt nem érhető el. Használd a Másolás gombot.'); return; }
  try { await downloads.save({ filename: `ajanlat-tervezet-${t.ekr}.md`, data: text }); toast('Letöltve'); }
  catch (e) { if (!e || e.code !== 'declined') toast('A letöltés nem sikerült. Használd a Másolás gombot.'); }
}

/* ---------- events ---------- */
function newProfile() {
  const id = 'p' + Date.now().toString(36);
  profiles.push(normProfile({ id, name: 'Új cég Kft.', revenue: 500, employees: 10, custom: true }));
  saveProfiles(); state.pid = id; saveUi(); paintPicker(); setTab('profile');
  toast('Új cégprofil létrehozva. Töltsd ki az adatokat.');
  $('#pf-name')?.select();
}
document.addEventListener('click', e => {
  const tabBtn = e.target.closest('[data-tab]');
  if (tabBtn) { setTab(tabBtn.dataset.tab); return; }
  const op = e.target.closest('[data-open]');
  if (op) {
    if (op.dataset.pid && op.dataset.pid !== state.pid) switchProfile(op.dataset.pid);
    openTender(op.dataset.open, op);
    return;
  }
  if (e.target.id === 'scrim') { closeDrawer(); return; }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act, t = curTender(), p = prof();
  const k = t ? qkey(p, t) : '';
  switch (act) {
    case 'close': closeDrawer(); break;
    case 'ai-summary': if (t) runSummary(t); break;
    case 'ai-qual': if (t) runQual(t); break;
    case 'ai-draft': if (t) runDraft(t, false); break;
    case 'ai-draft-again': if (t) runDraft(t, true); break;
    case 'tpl-draft':
      if (t) { mem.draft[k] = { status: 'done', text: templateDraft(p, t), source: 'tpl' }; drafts[k] = { text: mem.draft[k].text, source: 'tpl' }; store.set(KEY.drafts, drafts); paintDraft(t); }
      break;
    case 'goto-draft': $('#sec-draft')?.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' }); $('#draft-notes')?.focus({ preventScroll: true }); break;
    case 'stop-sum': if (t) mem.sum[t.id]?.ctl?.abort(); break;
    case 'stop-qual': mem.qual[k]?.ctl?.abort(); break;
    case 'stop-draft': mem.draft[k]?.ctl?.abort(); break;
    case 'copy-draft': if (mem.draft[k]?.text) copyText(mem.draft[k].text); break;
    case 'dl-draft': if (t && mem.draft[k]?.text) downloadDraft(t, mem.draft[k].text); break;
    case 'show-all': state.f.onlyFit = false; { const c = $('#f-fit'); if (c) c.checked = false; } paintList(); break;
    case 'reset-filters': state.f = { q: '', onlyFit: false, div: '', region: '', regime: '', due: '', min: '', max: '', sort: state.f.sort }; renderTab(); break;
    case 'watch-add': { const n = $('#watch-new')?.value; if (n) { setWatch(p, [...getWatch(p), n]); renderTab(); toast(`${n} figyelése bekapcsolva`); } break; }
    case 'watch-del': setWatch(p, getWatch(p).filter(x => x !== a.dataset.name)); renderTab(); break;
    case 'client-open': switchProfile(a.dataset.pid, false); setTab('tenders'); break;
    case 'client-edit': switchProfile(a.dataset.pid, false); setTab('profile'); break;
    case 'new-profile': newProfile(); break;
    case 'goto-finder': setTab('finder'); $('#finder-q')?.focus(); break;
    case 'goto-profile': setTab('profile'); break;
    case 'finder-example': finderSearch(a.dataset.q); renderTab(); break;
    case 'finder-pick': { const c = REGISTRY.find(x => x.tax === a.dataset.tax); if (c) { state.finder.q = c.name; activateCompany(c); renderTab(); } break; }
    case 'finder-ai': aiClassify(); break;
    case 'finder-create': createManual(); break;
    case 'save-temp': saveTemp(); break;
    case 'discard-temp': discardTemp(); break;
    case 'cpv-add': { const c = $('#cpv-new')?.value; if (c && !p.cpv.includes(c)) { p.cpv.push(c); saveProfiles(); renderTab(); } break; }
    case 'cpv-del': p.cpv.splice(Number(a.dataset.i), 1); saveProfiles(); renderTab(); break;
    case 'cert-add': { const v = ($('#cert-new')?.value || '').trim(); if (v) { p.certs.push(v); saveProfiles(); renderTab(); $('#cert-new')?.focus(); } break; }
    case 'cert-del': p.certs.splice(Number(a.dataset.i), 1); saveProfiles(); renderTab(); break;
    case 'staff-add': p.staff.push({ role: '', count: 1, years: 0 }); saveProfiles(); renderTab(); $(`#sf-r-${p.staff.length - 1}`)?.focus(); break;
    case 'staff-del': p.staff.splice(Number(a.dataset.i), 1); saveProfiles(); renderTab(); break;
    case 'ref-add': p.references.push({ title: '', buyer: '', value: 0, year: CUR_YEAR, cpv: p.cpv[0] || Object.keys(CPV)[0] }); saveProfiles(); renderTab(); $(`#rf-t-${p.references.length - 1}`)?.focus(); break;
    case 'ref-del': p.references.splice(Number(a.dataset.i), 1); saveProfiles(); renderTab(); break;
    case 'ask-reset': state.confirm = 'reset'; renderTab(); break;
    case 'ask-delete': state.confirm = 'delete'; renderTab(); break;
    case 'cancel-confirm': state.confirm = null; renderTab(); break;
    case 'do-reset': {
      const d = DEFAULT_PROFILES.find(x => x.id === p.id);
      if (d) { profiles[profiles.indexOf(p)] = normProfile(clone(d)); delete watch[p.id]; store.set(KEY.watch, watch); saveProfiles(); }
      state.confirm = null; paintPicker(); renderTab(); toast('Visszaállítva a példaadatra');
      break;
    }
    case 'do-delete': {
      if (profiles.length < 2) break;
      profiles = profiles.filter(x => x.id !== p.id); delete watch[p.id]; store.set(KEY.watch, watch); saveProfiles();
      state.confirm = null; switchProfile(profiles[0].id); toast('A profil törölve');
      break;
    }
    default: break;
  }
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'finder-form') return;
  e.preventDefault();
  finderSearch($('#finder-q').value);
  renderTab();
});
let qTimer;
document.addEventListener('input', e => {
  const el = e.target, type = el.type;
  const textual = type === 'text' || type === 'search' || type === 'number' || type === 'range' || el.tagName === 'TEXTAREA';
  if (!textual) return;
  if (el.dataset.filter) {
    state.f[el.dataset.filter] = el.value;
    clearTimeout(qTimer); qTimer = setTimeout(paintList, 140);
    return;
  }
  if (el.id === 'draft-notes') { const t = curTender(); if (t) mem.notes[qkey(prof(), t)] = el.value; return; }
  if (el.dataset.mf && state.finder.manual) { state.finder.manual[el.dataset.mf] = el.value; return; }
  if (el.dataset.rep === 'threshold') {
    report.threshold = Number(el.value); store.set(KEY.report, report);
    $('#rep-th-v').textContent = el.value; $('#mail').innerHTML = mailHtml();
    return;
  }
  const p = prof();
  if (el.dataset.pf) {
    const key = el.dataset.pf;
    p[key] = key === 'revenue' || key === 'employees' ? Math.max(0, Number(el.value) || 0) : el.value;
    saveProfiles();
    if (key === 'name') { const o = $(`#pick-profile option[value="${CSS.escape(p.id)}"]`); if (o) o.textContent = (p.id === TEMP ? 'Keresett: ' : '') + (el.value || 'Névtelen cég'); }
    return;
  }
  if (el.dataset.staff != null && p.staff[Number(el.dataset.staff)]) {
    const s = p.staff[Number(el.dataset.staff)], f = el.dataset.sf;
    s[f] = f === 'role' ? el.value : Math.max(0, Number(el.value) || 0);
    saveProfiles(); return;
  }
  if (el.dataset.ref != null && p.references[Number(el.dataset.ref)]) {
    const r = p.references[Number(el.dataset.ref)], f = el.dataset.rf;
    r[f] = f === 'title' || f === 'buyer' ? el.value : Number(el.value) || 0;
    saveProfiles();
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'pick-profile') { switchProfile(el.value); return; }
  if (el.tagName !== 'SELECT' && el.type !== 'checkbox') return;
  if (el.dataset.filter) { state.f[el.dataset.filter] = el.type === 'checkbox' ? el.checked : el.value; paintList(); return; }
  if (el.dataset.rep) { report[el.dataset.rep] = el.type === 'checkbox' ? el.checked : el.value; store.set(KEY.report, report); $('#mail').innerHTML = mailHtml(); return; }
  if (el.dataset.mf && state.finder.manual) { state.finder.manual[el.dataset.mf] = el.value; if (el.dataset.mf === 'sector') { state.finder.manual.aiCpv = null; state.finder.manual.ai = null; } return; }
  const p = prof();
  if (el.dataset.region) {
    const r = el.dataset.region;
    p.regions = el.checked ? [...new Set([...p.regions, r])] : p.regions.filter(x => x !== r);
    saveProfiles(); return;
  }
  if (el.dataset.ref != null && el.dataset.rf === 'cpv' && p.references[Number(el.dataset.ref)]) { p.references[Number(el.dataset.ref)].cpv = el.value; saveProfiles(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && state.open) closeDrawer(); });
document.addEventListener('pointerover', e => { const r = e.target.closest?.('.bar-row'); if (r) showTip(r, e.clientX, e.clientY); });
document.addEventListener('pointermove', e => { if (e.target.closest?.('.bar-row')) placeTip(e.clientX, e.clientY); });
document.addEventListener('pointerout', e => { const r = e.target.closest?.('.bar-row'); if (r && !r.contains(e.relatedTarget)) hideTip(); });
document.addEventListener('focusin', e => { const r = e.target.closest?.('.bar-row'); if (r) { const b = r.getBoundingClientRect(); showTip(r, b.left + 120, b.top + 10); } });
document.addEventListener('focusout', e => { if (e.target.closest?.('.bar-row')) hideTip(); });
window.addEventListener('scroll', hideTip, { passive: true });

/* ---------- boot ---------- */
paintPicker();
paintAiChip();
renderTab();
})();
</script>
